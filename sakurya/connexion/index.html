<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion · Sakurya</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="../img/hall-1600.webp">
<link rel="stylesheet" href="connexion.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <img src="../img/hall-1600.webp" srcset="../img/hall-1600.webp 1600w, ../img/hall.webp 2752w" sizes="100vw" alt="">
  <canvas id="petals"></canvas>
  <div class="shade"></div>
</div>

<a class="logo" href="../" aria-label="Sakurya, retour à l'accueil">
  <span class="logo-mark" aria-hidden="true">
    <svg viewBox="0 0 40 40"><g fill="currentColor"><path d="M20 4c3 4 3 9 0 13-3-4-3-9 0-13z"/><path d="M35.2 15.1c-1.5 4.8-5.6 7.7-10.4 7.4 1.5-4.7 5.6-7.6 10.4-7.4z"/><path d="M29.4 33c-4.9.2-8.9-2.8-10.3-7.5 4.9-.2 8.9 2.8 10.3 7.5z"/><path d="M10.6 33c1.4-4.7 5.4-7.7 10.3-7.5-1.4 4.7-5.4 7.7-10.3 7.5z"/><path d="M4.8 15.1c4.8-.2 8.9 2.7 10.4 7.4-4.8.3-8.9-2.6-10.4-7.4z"/></g><circle cx="20" cy="20" r="3" fill="#f6c453"/></svg>
  </span>
  <span class="logo-text">Sakurya</span>
</a>

<main class="stage">
  <form class="card" id="login" novalidate>
    <p class="hello" id="hello">Bonsoir.</p>
    <h1>Bienvenue dans la ville.</h1>
    <p class="sub">Connecte-toi pour retrouver ton espace, tes outils et les autres membres.</p>

    <label class="field">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
      <span class="sr">Adresse e-mail</span>
      <input type="email" name="email" placeholder="Adresse e-mail" autocomplete="email" required>
    </label>

    <label class="field">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
      <span class="sr">Mot de passe</span>
      <input type="password" name="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" required>
      <button type="button" class="eye" id="eye" aria-label="Afficher le mot de passe" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </label>

    <div class="row">
      <label class="check"><input type="checkbox" name="remember"> <span>Se souvenir de moi</span></label>
      <a href="#" data-soon>Mot de passe oublié ?</a>
    </div>

    <button class="btn" type="submit">Entrer dans la ville <span aria-hidden="true">→</span></button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <div class="join">
    Pas encore membre ? <a href="../#tarifs">Rejoindre Sakurya</a> · <a href="../ville/">Voir la ville en démo</a>
  </div>

  <nav class="legal" aria-label="Informations légales">
    <a href="#" data-soon>Mentions légales</a>
    <a href="#" data-soon>CGV</a>
    <a href="#" data-soon>Confidentialité</a>
  </nav>
</main>

<script src="connexion.js"></script>
</body>
</html>
